name: CI/CD Pipeline - Flask App # Nome amigável do seu workflow. Aparece na aba "Actions" do GitHub.
on: # Gatilhos: define quando este workflow será executado automaticamente.
  push: # Ao fazer um 'git push'
    branches:
      - main # Este workflow será acionado sempre que houver um push para a branch 'main'.
              # Isso garante a Integração Contínua: cada nova mudança é processada.
  pull_request: # Ao abrir ou atualizar um Pull Request (PR)
    branches:
      - main # Também executa para PRs direcionados à branch 'main'. É uma boa prática para
              # validar o código antes que ele seja mesclado na branch principal.

env: # Variáveis de ambiente que estarão disponíveis para todos os jobs/passos neste workflow.
  DOCKER_IMAGE_NAME: devsecops-pipeline-app # Define o nome da sua imagem Docker.
                                             # Deve ser o mesmo nome que você usou no 'docker build' local.
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }} # Acessa o segredo 'DOCKER_USERNAME' que você criou no GitHub.
                                                 # ${{ secrets.<NOME_DO_SEGREDO> }} é a sintaxe para acessar segredos.
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }} # Acessa o segredo 'DOCKER_PASSWORD' (seu token do Docker Hub).

jobs: # Definição dos trabalhos (jobs) que compõem este workflow. Um workflow pode ter um ou mais jobs.
  build-and-scan: # Nome do nosso primeiro job: construir e escanear a imagem.
    runs-on: ubuntu-latest # O ambiente de execução: uma máquina virtual Ubuntu mais recente, fornecida gratuitamente pelo GitHub.
    steps: # Sequência de passos a serem executados dentro do job 'build-and-scan'.

      - name: Checkout code # Passo 1: Clona o código do seu repositório para a máquina virtual do GitHub Actions.
                            # É sempre o primeiro passo para ter acesso aos seus arquivos.
        uses: actions/checkout@v4 # Usa uma action pré-definida do GitHub para realizar o checkout.

      - name: Set up Docker Buildx # Passo 2: Configura a ferramenta Buildx, que otimiza o processo de build do Docker.
                                  # Permite construir imagens mais eficientemente e para múltiplas arquiteturas.
        uses: docker/setup-buildx-action@v3 # Action oficial do Docker para configurar o Buildx.

      - name: Login to Docker Hub # Passo 3: Realiza o login seguro no Docker Hub.
                                # Essencial para que o GitHub Actions possa enviar sua imagem.
        uses: docker/login-action@v3 # Action oficial do Docker para login.
        with: # Parâmetros para a action de login.
          username: ${{ env.DOCKER_USERNAME }} # Usa a variável de ambiente definida acima (que vem do segredo).
          password: ${{ env.DOCKER_PASSWORD }} # Usa a variável de ambiente (que vem do segredo/token).

      - name: Build and push Docker image # Passo 4: Constrói a imagem Docker da sua aplicação e a envia para o Docker Hub.
        uses: docker/build-push-action@v5 # Action oficial do Docker para build e push.
        with: # Parâmetros para a action de build e push.
          context: . # O contexto da build é o diretório raiz do seu repositório clonado (onde está o Dockerfile).
          push: true # Define que a imagem deve ser enviada (push) para o Docker Hub.
          tags: ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest # Define a tag da imagem completa.
                                                                            # Formato: seu_usuario_docker/nome_da_imagem:latest
                                                                            # Ex: fabiola_sakae/devsecops-pipeline-app:latest

      - name: Download Trivy # Passo 5: Baixa e prepara a ferramenta Trivy na máquina virtual do GitHub Actions.
                            # Trivy é um scanner de vulnerabilidades de imagens de contêiner.
        uses: aquasecurity/trivy-action/setup@v0 # Action para configurar o Trivy.
        with:
          version: '0.51.0' # Especifica uma versão específica do Trivy a ser baixada e usada.

      - name: Scan Docker image with Trivy # Passo 6: Executa o scan de segurança na imagem Docker com Trivy.
        uses: aquasecurity/trivy-action@master # Action para rodar o scan do Trivy.
        with: # Parâmetros para o scan do Trivy.
          image-ref: ${{ env.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest # A imagem que será escaneada.
          format: 'table' # Define o formato de saída dos resultados no log do GitHub Actions (tabela, fácil de ler).
          exit-code: '1' # **CRUCIAL PARA DEVSECOPS!** Se o Trivy encontrar vulnerabilidades com a 'severity' especificada,
                        # este passo falhará (código de saída 1). Isso é bom, pois impede que imagens vulneráveis
                        # avancem na pipeline.
          severity: 'CRITICAL,HIGH' # Define quais níveis de severidade de vulnerabilidade farão o passo falhar.
                                    # (Crítica e Alta). Você pode ajustar isso conforme sua política de segurança.
          # ignore-unfixed: true # Opcional: Ignora vulnerabilidades que ainda não têm correção (patches) disponível.
          # vuln-type: 'os,library' # Opcional: Tipos de vulnerabilidades a serem escaneadas (sistema operacional, bibliotecas).
          # output: 'trivy-results.sarif' # Opcional: Salva os resultados em um arquivo SARIF (útil para integração com outras ferramentas).

      # Os próximos passos para o deploy contínuo (CD com ArgoCD e Kubernetes) serão
      # configurados em uma etapa posterior, talvez em um job separado ou em outro arquivo de workflow.